name: smart_transport
description: "Plateforme Smart Transport"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Gestion d'état
  provider: ^6.1.2

  # Requêtes HTTP vers Laravel
  dio: ^5.4.3

  # Stockage local (token JWT)
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # QR Code (affichage uniquement, compatible web)
  qr_flutter: ^4.1.0

  # Scanner QR (mobile uniquement)
  mobile_scanner: ^5.1.0

  # ✅ Carte OpenStreetMap (gratuit + web + Android + iOS)
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # ✅ Localisation GPS
  geolocator: ^10.1.0
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ✅ Assets images (logos paiement)
  assets:
    - assets/images/wave.png
    - assets/images/orange_money.png